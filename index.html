<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Componente</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <div class="card-content">
      <div class="card-text">
        <h1 class="number">20</h1>
        <p class="label">Mensajes</p>

          <span class="percentage">4.46%</span>

        </div>
      </div>
      <div class="icon-circle">
        💬
      </div>
    </div>
  </div>
</body>
</html>
